# NovaLikes — Nginx template (do not apply until DNS + app are ready)
# Canonical host: novalikes.com  (matches config/site.ts and SEO_PRODUCTION_DOMAIN)
# www.novalikes.com → novalikes.com (one hop)
#
# Install later:
#   sudo cp deploy/nginx/novalikes.conf /etc/nginx/sites-available/novalikes
#   sudo ln -s /etc/nginx/sites-available/novalikes /etc/nginx/sites-enabled/novalikes
#   sudo nginx -t && sudo systemctl reload nginx
#
# After Certbot, replace the HTTP www redirect with HTTPS → https://novalikes.com

upstream novalikes_next {
    server 127.0.0.1:3000;
    keepalive 64;
}

server {
    listen 80;
    listen [::]:80;
    server_name www.novalikes.com;
    return 301 http://novalikes.com$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name novalikes.com;

    client_max_body_size 8m;

    location / {
        proxy_pass http://novalikes_next;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
    }
}
