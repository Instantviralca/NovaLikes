# NovaLikes — Nginx template (do not apply blindly over a Certbot-managed live file)
# Canonical host: novalikes.com  (matches config/site.ts and SEO_PRODUCTION_DOMAIN)
#
# Desired redirects (ONE hop each — preserve path + query):
#   http://novalikes.com/*          → https://novalikes.com/*
#   http://www.novalikes.com/*      → https://novalikes.com/*
#   https://www.novalikes.com/*     → https://novalikes.com/*
#
# LIVE FIX (A35) — SERVER ACTION REQUIRED on Contabo:
#   In the www server block(s), change any
#     return 301 http://novalikes.com$request_uri;
#   to
#     return 301 https://novalikes.com$request_uri;
#   Ensure HTTPS www also returns 301 https://novalikes.com$request_uri;
#   Then: sudo nginx -t && sudo systemctl reload nginx
#
# Install skeleton (pre-Certbot HTTP only; Certbot will add 443 blocks):
#   sudo cp deploy/nginx/novalikes.conf /etc/nginx/sites-available/novalikes
#   sudo ln -s /etc/nginx/sites-available/novalikes /etc/nginx/sites-enabled/novalikes
#   sudo nginx -t && sudo systemctl reload nginx

upstream novalikes_next {
    # Next binds `-H localhost` → Ubuntu IPv6 loopback [::1]:3000 (not 127.0.0.1).
    # Using 127.0.0.1 here causes Nginx 502 after the localhost HOSTNAME fix.
    server [::1]:3000;
    keepalive 64;
}

# HTTP www → HTTPS apex (one hop — never redirect www to http://apex)
server {
    listen 80;
    listen [::]:80;
    server_name www.novalikes.com;
    return 301 https://novalikes.com$request_uri;
}

# HTTP apex → app (Certbot typically converts this to HTTPS redirect + 443 proxy)
server {
    listen 80;
    listen [::]:80;
    server_name novalikes.com;

    client_max_body_size 8m;

    location / {
        proxy_pass http://novalikes_next;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
    }
}
